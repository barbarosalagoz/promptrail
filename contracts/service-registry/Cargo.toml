[package]
name = "service-registry"
version = "0.1.0"
edition = "2021"
publish = false
description = "PromptRail Service Registry - on-chain catalog of machine-payable services"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
